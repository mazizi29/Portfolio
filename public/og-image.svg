<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,400&amp;family=Manrope:wght@400;600;800&amp;family=JetBrains+Mono:wght@500&amp;display=swap');
      .bg { fill: #F7F7F5; }
      .border { stroke: #E5E5E0; stroke-width: 2; fill: none; }
      .inner-card { fill: #FFFFFF; stroke: #E8E8E3; stroke-width: 1.5; rx: 16px; }
      .badge-bg { fill: #FFFFFF; stroke: #E0E0DB; stroke-width: 1.5; rx: 100px; }
      .badge-dot { fill: #22C55E; }
      .title { font-family: 'Fraunces', serif; font-weight: 600; font-size: 56px; fill: #111111; letter-spacing: -0.03em; }
      .title-italic { font-family: 'Fraunces', serif; font-style: italic; font-weight: 400; fill: #111111; }
      .role { font-family: 'Manrope', sans-serif; font-weight: 800; font-size: 26px; fill: #111111; letter-spacing: -0.01em; }
      .desc { font-family: 'Manrope', sans-serif; font-weight: 400; font-size: 20px; fill: #666663; }
      .mono { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 14px; fill: #111111; letter-spacing: 0.12em; text-transform: uppercase; }
      .mono-muted { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 13px; fill: #888884; letter-spacing: 0.08em; text-transform: uppercase; }
      .pill { fill: #F0F0EB; rx: 6px; }
      .pill-text { font-family: 'JetBrains Mono', monospace; font-size: 13px; fill: #333330; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" class="bg" />
  
  <!-- Outer Decorative Border -->
  <rect x="32" y="32" width="1136" height="566" class="border" rx="12" />

  <!-- Inner Content Card -->
  <g transform="translate(64, 64)">
    <rect width="1072" height="502" class="inner-card" />

    <!-- Top Row: Logo & Status Badge -->
    <g transform="translate(48, 48)">
      <!-- Logo Symbol -->
      <rect x="0" y="0" width="36" height="36" rx="8" fill="#111111" />
      <text x="18" y="24" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="700" font-size="16" fill="#F7F7F5">A</text>
      
      <text x="48" y="16" class="mono">PORTFOLIO</text>
      <text x="48" y="32" class="mono-muted">M. Azizi Abdillah</text>
      
      <!-- Availability Badge -->
      <g transform="translate(730, 0)">
        <rect width="246" height="36" class="badge-bg" />
        <circle cx="20" cy="18" r="4.5" class="badge-dot" />
        <text x="34" y="23" class="mono" font-size="11">TERBUKA UNTUK MAGANG</text>
      </g>
    </g>

    <!-- Main Title & Headline -->
    <g transform="translate(48, 145)">
      <text x="0" y="50" class="title">Crafting Digital Products</text>
      <text x="0" y="115" class="title"><tspan class="title-italic">with Joy</tspan> &amp; Purpose.</text>

      <text x="0" y="180" class="role">UI/UX Design · Front-End Development · Systems</text>
      <text x="0" y="215" class="desc">Mahasiswa Informatika UNU Yogyakarta dengan latar belakang multimedia.</text>
    </g>

    <!-- Bottom Feature Tags -->
    <g transform="translate(48, 420)">
      <g transform="translate(0, 0)">
        <rect width="130" height="32" class="pill" />
        <text x="65" y="21" text-anchor="middle" class="pill-text">REACT NATIVE</text>
      </g>
      <g transform="translate(142, 0)">
        <rect width="120" height="32" class="pill" />
        <text x="60" y="21" text-anchor="middle" class="pill-text">FIGMA UI/UX</text>
      </g>
      <g transform="translate(274, 0)">
        <rect width="150" height="32" class="pill" />
        <text x="75" y="21" text-anchor="middle" class="pill-text">TAILWIND CSS</text>
      </g>
      <g transform="translate(436, 0)">
        <rect width="160" height="32" class="pill" />
        <text x="80" y="21" text-anchor="middle" class="pill-text">PYTHON AUTOMATION</text>
      </g>

      <!-- URL signature -->
      <text x="976" y="22" text-anchor="end" class="mono-muted" font-size="14">portfolio2905.netlify.app</text>
    </g>
  </g>
</svg>
